name: Coolify Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          npm init -y
          npm install typescript ts-node @types/node @actions/core @actions/github axios @types/axios

      - name: Create tsconfig.json
        run: |
          echo '{
            "compilerOptions": {
              "target": "ES2020",
              "module": "commonjs",
              "esModuleInterop": true,
              "skipLibCheck": true,
              "forceConsistentCasingInFileNames": true,
              "outDir": "./dist"
            }
          }' > tsconfig.json

      - name: Execute Deploy Script
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/scripts/deploy.js');
            await script({github, context, core});
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.APP_UUID }}
          SECRETS: ${{ secrets.SECRETS }}
